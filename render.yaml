# Render Blueprint: free web service running API + worker from infra/Dockerfile.free.
# Postgres = Neon, object storage = Cloudflare R2, web = Vercel. Fill the sync:false secrets
# in the Render dashboard on first deploy.
services:
  - type: web
    name: renovation-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/Dockerfile.free
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: COOKIE_SECURE
        value: "true"
      - key: SEGMENTATION_ENABLED
        value: "false"
      - key: S3_BUCKET
        value: renovation
      - key: S3_REGION
        value: auto
      - key: CORS_ORIGINS
        value: https://ai-exterior-house-renovation.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_PUBLIC_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
