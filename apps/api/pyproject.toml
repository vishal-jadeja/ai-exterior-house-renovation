[project]
name = "renovation-api"
version = "0.1.0"
description = "AI-based exterior house renovation & cost estimation API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "slowapi>=0.1.9",
  "boto3>=1.34",
  "pillow>=10.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "httpx>=0.27",
  "jinja2>=3.1",
  "structlog>=24.1",
  "email-validator>=2.1",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.41", "google-genai>=1.0"]
report = ["weasyprint>=62"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
